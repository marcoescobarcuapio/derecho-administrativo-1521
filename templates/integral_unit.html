<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="author" content="@@AUTHOR@@">
  <meta name="description" content="Presentación integral de Derecho Administrativo 1521, Unidad @@UNIT@@.">
  <title>@@DOCUMENT_TITLE@@</title>
  <link rel="stylesheet" href="@@RUNTIME@@/assets/integral-core.css">
  <link rel="stylesheet" href="@@RUNTIME@@/assets/integral-themes.css">
</head>
<body class="@@BODY_CLASS@@" data-unit="@@UNIT@@" data-theme="@@THEME@@">
  <a class="skip-link" href="#contenido-principal">Saltar a la presentación</a>
  <header class="institutional-header">
    <div class="brand-lockup brand-unam">
      <img src="@@RUNTIME@@/assets/branding/unam-blanco.png" alt="Universidad Nacional Autónoma de México">
      <span>Universidad Nacional Autónoma de México</span>
    </div>
    <div class="course-signature">
      <span>Derecho Administrativo · 1521</span>
      <strong>Unidad @@UNIT@@ · @@PUBLIC_TITLE@@</strong>
      <small>Versión integral · @@MOTIF@@</small>
    </div>
    <div class="brand-lockup brand-fd">
      <span>Facultad de Derecho</span>
      <img src="@@RUNTIME@@/assets/branding/facultad-derecho-blanco.png" alt="Facultad de Derecho">
    </div>
  </header>
  <main id="contenido-principal" class="integral-deck" aria-label="@@PUBLIC_TITLE@@">
@@SLIDES@@
  </main>
@@MAP@@
@@NAVIGATION@@
  <footer class="public-author">Autor: @@AUTHOR@@</footer>
  <noscript><p class="noscript-note">La presentación permanece disponible en orden de lectura. Active JavaScript para usar la navegación por láminas.</p></noscript>
@@SCRIPT@@
</body>
</html>
